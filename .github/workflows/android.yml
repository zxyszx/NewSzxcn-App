name: Android Preview Build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [demo, live]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web check:shadcn
      - if: matrix.mode == 'demo'
        run: pnpm --dir apps/web android:sync:public
      - if: matrix.mode == 'live'
        run: pnpm --dir apps/web android:sync:live
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain
        working-directory: apps/web/android
      - uses: actions/upload-artifact@v4
        with:
          name: NewSzxcn-android-${{ matrix.mode }}-ci-debug
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
